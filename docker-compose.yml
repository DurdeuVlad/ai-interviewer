services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEBUG_MODE: ${DEBUG_MODE:-false}
      CORS_ORIGIN: http://localhost:5173
      # Overrides config.py's default of BASE_DIR/interviews.db so the DB file lands on
      # the named volume below instead of the container's writable layer (lost on rebuild).
      DATABASE_PATH: /app/db/interviews.db
    volumes:
      - backend_db:/app/db
      - backend_exports:/app/exports

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_db:
  backend_exports:
