server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router (BrowserRouter) handles deep links like /interview/3
    # client-side - nginx must serve index.html for any unknown path, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
